name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `closed` is only there so the PR's Preview can be deleted; the checks skip it.
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm lint
      - run: pnpm format:check

      # Turnstile's always-pass dummy secret, matching the dummy sitekey the e2e build uses.
      - name: Write .dev.vars
        run: printf 'TURNSTILE_SECRET=1x0000000000000000000000000000000AA\nTURNSTILE_HOSTNAMES=\n' > .dev.vars
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright's web server runs `pnpm build`, which includes `astro check`.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Rebuilt here rather than reused from `check`: the e2e build bakes in the dummy Turnstile sitekey.
      - run: pnpm build
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Every same-repo PR gets a Preview: an isolated copy of the Worker, configured by the `previews` block
  # in wrangler.jsonc, at pr-<number>-ronsj-dev.<subdomain>.workers.dev. Production is untouched.
  # Fork PRs are skipped because they can't see the Cloudflare secrets.
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch itself, not GitHub's merge of it into main, so the Preview matches the commit it's labelled with.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Create or update the Preview
        id: preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler writes a structured record of the Preview here, which is safer to read than its log.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          NAME: pr-${{ github.event.number }}
          MESSAGE: 'PR #${{ github.event.number }} @ ${{ github.event.pull_request.head.sha }}'
        run: |
          pnpm exec wrangler preview --name "$NAME" --message "$MESSAGE"
          url=$(jq -r 'select(.type == "preview") | .preview_urls[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::The Preview was created but has no URL. Check that Preview URLs are enabled on the Worker's workers.dev settings."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the Preview URL on the PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # One comment per PR, found again by its marker so other bots' comments are left alone.
          marker='<!-- preview-url -->'
          body="$marker
          **Preview:** $URL

          Built from ${SHA:0:7}. The URL stays the same for every push to this PR."
          existing=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" --silent
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" --silent
          fi

  # Delete the PR's Preview once the PR is closed or merged. Shares the preview job's concurrency group so
  # a preview run still in flight is cancelled rather than recreating the Preview after it's been deleted.
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: true
    steps:
      # Only wrangler.jsonc is needed (for the Worker name), so skip the dependency install.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false
      # A PR that never got a Preview (opened before this job existed, or whose preview job failed) has
      # nothing to delete, and that shouldn't turn the closed PR red.
      - run: npx --yes wrangler@4 preview delete --name "pr-${{ github.event.number }}" --skip-confirmation
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
