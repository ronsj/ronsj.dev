pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{js,mjs,cjs,ts,tsx,astro}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: format
      glob: '*.{js,mjs,cjs,ts,tsx,json,jsonc,css,md,yml,yaml}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
